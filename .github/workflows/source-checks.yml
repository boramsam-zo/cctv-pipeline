name: CCTV source checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/source-checks.yml'
      - '.streamlit/**'
      - 'apps/be_worker/**'
      - 'apps/cctv_ui/**'
      - 'apps/team_rag/**'
      - 'apps/scene_description/**'
      - 'apps/runpod_image/requirements-ci.txt'
      - 'scripts/activate_mlops_session.py'
      - 'scripts/activate_report_continuation.py'
      - 'scripts/recover_r2_saved_report.py'
      - 'scripts/start_runpod_demo.py'
      - 'scripts/ci_source_checks.py'
      - 'scripts/prepare_git_publication.py'
      - 'scripts/requirements-viewer.txt'
      - 'apps/runpod_image/start-model-session.sh'
      - 'tests/be_worker/**'
      - 'tests/cctv_ui/**'
      - 'tests/team_rag/**'
      - 'tests/scene_description/**'
      - 'tests/runpod/test_demo_start.py'
      - 'tests/test_git_publication.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-checks.yml'
      - '.streamlit/**'
      - 'apps/be_worker/**'
      - 'apps/cctv_ui/**'
      - 'apps/team_rag/**'
      - 'apps/scene_description/**'
      - 'apps/runpod_image/requirements-ci.txt'
      - 'scripts/activate_mlops_session.py'
      - 'scripts/activate_report_continuation.py'
      - 'scripts/recover_r2_saved_report.py'
      - 'scripts/start_runpod_demo.py'
      - 'scripts/ci_source_checks.py'
      - 'scripts/prepare_git_publication.py'
      - 'scripts/requirements-viewer.txt'
      - 'apps/runpod_image/start-model-session.sh'
      - 'tests/be_worker/**'
      - 'tests/cctv_ui/**'
      - 'tests/team_rag/**'
      - 'tests/scene_description/**'
      - 'tests/runpod/test_demo_start.py'
      - 'tests/test_git_publication.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cctv-source-checks-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node.js 24
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: python -m pip install --disable-pip-version-check -r apps/runpod_image/requirements-ci.txt -r scripts/requirements-viewer.txt jsonschema==4.25.1
      - name: Report reuse, saved-response recovery and schema-cache checks
        run: python -B scripts/ci_source_checks.py --group report
      - name: MLflow request, response, token and read-boundary checks
        run: python -B scripts/ci_source_checks.py --group mlflow
      - name: Demo limits and public read-only boundaries
        run: python -B scripts/ci_source_checks.py --group demo
      - name: Synthetic UI submission, notification and refresh checks
        # API doubles only; private saved CCTV fixtures are explicitly excluded.
        run: python -B scripts/ci_source_checks.py --group ui
      - name: Publication privacy boundaries
        run: python -B scripts/ci_source_checks.py --group privacy
      - name: Synthetic document relevance checks
        run: python -B scripts/ci_source_checks.py --group rag

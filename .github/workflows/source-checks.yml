name: CCTV source checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/source-checks.yml'
      - '.streamlit/**'
      - 'apps/be_worker/**'
      - 'apps/cctv_ui/**'
      - 'apps/team_rag/**'
      - 'apps/scene_description/**'
      - 'apps/runpod_image/requirements-ci.txt'
      - 'scripts/activate_mlops_session.py'
      - 'scripts/activate_report_continuation.py'
      - 'scripts/prepare_git_publication.py'
      - 'scripts/requirements-viewer.txt'
      - 'tests/be_worker/**'
      - 'tests/cctv_ui/**'
      - 'tests/team_rag/**'
      - 'tests/test_git_publication.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-checks.yml'
      - '.streamlit/**'
      - 'apps/be_worker/**'
      - 'apps/cctv_ui/**'
      - 'apps/team_rag/**'
      - 'apps/scene_description/**'
      - 'apps/runpod_image/requirements-ci.txt'
      - 'scripts/activate_mlops_session.py'
      - 'scripts/activate_report_continuation.py'
      - 'scripts/prepare_git_publication.py'
      - 'scripts/requirements-viewer.txt'
      - 'tests/be_worker/**'
      - 'tests/cctv_ui/**'
      - 'tests/team_rag/**'
      - 'tests/test_git_publication.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cctv-source-checks-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node.js 24
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: python -m pip install --disable-pip-version-check -r apps/runpod_image/requirements-ci.txt -r scripts/requirements-viewer.txt jsonschema==4.25.1
      - name: Report reuse and execution-boundary checks
        run: >-
          python -B -m unittest
          tests.be_worker.test_report_continuation
          tests.be_worker.test_report_activation
          tests.be_worker.test_report_jobs
          tests.be_worker.test_report_review
          tests.be_worker.test_stored_selection_view
          tests.be_worker.test_hour_session_windows
          tests.be_worker.test_trial_limits -v
      - name: Synthetic UI submission and empty-result checks
        # These tests use API doubles; private saved CCTV fixtures are excluded.
        run: >-
          python -B -m unittest
          tests.cctv_ui.test_app.AppTests.test_model_selection_keeps_full_report_request_and_does_not_auto_submit
          tests.cctv_ui.test_app.AppTests.test_same_filename_different_bytes_are_visible_in_rejection_receipt
          tests.cctv_ui.test_app.AppTests.test_unknown_admission_response_is_not_automatically_posted_again
          tests.cctv_ui.test_control_room.ControlRoomTests.test_empty_records_and_missing_vlm_are_not_normal_predictions
          tests.cctv_ui.test_report_revisions -v
      - name: Publication privacy boundaries
        run: python -B -m unittest tests.test_git_publication -v
      - name: Synthetic document relevance checks
        run: python -B -m unittest tests.team_rag.test_relevance_synthetic -v

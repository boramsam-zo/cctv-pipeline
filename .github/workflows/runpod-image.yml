name: Runpod image

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runpod-image.yml'
      - 'apps/runpod_image/**'
      - 'apps/runpod_worker/storage.py'
      - 'apps/runpod_worker/verify_bundle.py'
      - 'apps/model_compare/**'
      - 'apps/be_worker/**'
      - 'infra/compose/mlflow/**'
      - 'scripts/prepare_runpod_ci.py'
      - 'scripts/runpod_ci_registry.py'
      - 'scripts/runpod_ci_changes.py'
      - 'scripts/build_runpod_service_bundle.py'
      - 'scripts/build_be_mlops_bundle.py'
      - 'scripts/build_mlops_be_image.py'
      - 'scripts/activate_mlops_session.py'
      - 'scripts/register_mlops_models.py'
      - 'tests/runpod_image/test_mlops*.py'
      - 'tests/be_worker/test_mlops*.py'
      - 'tests/be_worker/test_mlflow_tracking.py'
      - 'tests/be_worker/test_register_mlops_models.py'
      - 'tests/be_worker/test_ab_storage_parallel.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/runpod-image.yml'
      - 'apps/runpod_image/**'
      - 'apps/runpod_worker/storage.py'
      - 'apps/runpod_worker/verify_bundle.py'
      - 'apps/model_compare/**'
      - 'apps/be_worker/**'
      - 'infra/compose/mlflow/**'
      - 'scripts/prepare_runpod_ci.py'
      - 'scripts/runpod_ci_registry.py'
      - 'scripts/runpod_ci_changes.py'
      - 'scripts/build_runpod_service_bundle.py'
      - 'scripts/build_be_mlops_bundle.py'
      - 'scripts/build_mlops_be_image.py'
      - 'scripts/activate_mlops_session.py'
      - 'scripts/register_mlops_models.py'
      - 'tests/runpod_image/test_mlops*.py'
      - 'tests/be_worker/test_mlops*.py'
      - 'tests/be_worker/test_mlflow_tracking.py'
      - 'tests/be_worker/test_register_mlops_models.py'
      - 'tests/be_worker/test_ab_storage_parallel.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runpod-image-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publish_required: ${{ steps.changes.outputs.publish_required }}
    steps:
      # Pinned to the official release commits; no checkout token is persisted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node.js 24
        with:
          python-version: '3.12'
      - name: Distinguish image changes from BE-only checks
        id: changes
        env:
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_BEFORE: ${{ github.event.before }}
          CHANGE_AFTER: ${{ github.sha }}
        run: python -B scripts/runpod_ci_changes.py --event "$CHANGE_EVENT" --before "$CHANGE_BEFORE" --after "$CHANGE_AFTER"
      - name: Install CPU service test dependencies
        run: python -m pip install --disable-pip-version-check -r apps/runpod_image/requirements-ci.txt
      - name: Offline contract and packaging checks
        run: |
          python -B -m unittest discover -s tests/runpod_image -p 'test_mlops*.py' -v
          python -B -m unittest discover -s tests/be_worker -p 'test_mlops*.py' -v
          python -B -m unittest tests.be_worker.test_mlflow_tracking tests.be_worker.test_register_mlops_models -v
          python -B -m unittest tests.be_worker.test_ab_storage_parallel -v
          python -B scripts/prepare_runpod_ci.py --output "$RUNNER_TEMP/runpod-check"

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.check.outputs.publish_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUNPOD_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'dahyeguk/cctv-runpod-ab' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node.js 24
        with:
          python-version: '3.12'
      - name: Prepare allowlisted code context
        run: python -B scripts/prepare_runpod_ci.py --output "$RUNNER_TEMP/runpod-release"
      - name: Reserve disk for the CUDA base on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux || "${RUNNER_ARCH:-}" != X64 ]]; then
            echo '::error::SDK cleanup is restricted to GitHub-hosted Linux X64 job VMs.'
            exit 1
          fi
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          test -d "$docker_root"
          echo 'Disk space before removing unused preinstalled SDKs:'
          df -h "$docker_root" "$GITHUB_WORKSPACE"
          # Fixed SDK allowlist only. Keep Python/toolcache siblings, Docker,
          # checkout, build context, credentials and all model files intact.
          # Swift's official runner-image installer uses /usr/share/swift.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          minimum_kib=$((40 * 1024 * 1024))
          available_kib=$(df -Pk "$docker_root" | awk 'NR == 2 {print $4}')
          if [[ "$available_kib" =~ ^[0-9]+$ ]] && (( available_kib < minimum_kib )); then
            # This fresh job VM has not created Buildx or pulled our base yet.
            # Prune only unused preloaded images; keep Docker and all volumes.
            docker image prune --all --force
          fi
          echo 'Disk space available for CUDA extraction and image export:'
          df -h "$docker_root" "$GITHUB_WORKSPACE"
          for storage_path in "$docker_root" "$GITHUB_WORKSPACE"; do
            available_kib=$(df -Pk "$storage_path" | awk 'NR == 2 {print $4}')
            if [[ ! "$available_kib" =~ ^[0-9]+$ ]] || (( available_kib < minimum_kib )); then
              echo '::error::At least 40 GiB free is required before extracting the CUDA base. SDK cleanup was insufficient; use a runner with more disk.'
              exit 1
            fi
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1, Node.js 24
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0, Node.js 24
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Preserve existing commit tags
        id: registry
        run: python -B scripts/runpod_ci_registry.py inspect --image "$RUNPOD_IMAGE" --commit "$GITHUB_SHA"
      - name: Build and publish Linux amd64
        if: steps.registry.outputs.exists == 'false'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0, Node.js 24
        with:
          context: ${{ runner.temp }}/runpod-release/context
          file: ${{ runner.temp }}/runpod-release/context/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.registry.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=runpod-mlops-amd64
          cache-to: type=gha,mode=max,scope=runpod-mlops-amd64
          provenance: mode=min
      - name: Image tag and digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest || steps.registry.outputs.digest }}
        run: python -B scripts/runpod_ci_registry.py summary --image "$RUNPOD_IMAGE" --commit "$GITHUB_SHA" --digest "$IMAGE_DIGEST"

# Deployment example, not applied by the application or CI build workflow.
# Measure current EC2 headroom before using this candidate memory limit.
name: cctv-mlflow
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    restart: unless-stopped
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - '5000'
      - --workers
      - '1'
      - --allowed-hosts
      - localhost:*,127.0.0.1:*,mlflow:5000
      - --backend-store-uri
      - sqlite:////mlflow-data/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow-data/artifacts
    ports:
      - 127.0.0.1:5000:5000
    volumes:
      - mlflow-data:/mlflow-data
    networks: [tracking]
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
volumes:
  mlflow-data:
    name: cctv-mlflow-data
networks:
  tracking:
    name: cctv-mlflow-tracking
    internal: true
